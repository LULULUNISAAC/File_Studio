<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF — File Studio</title>
<meta name="description" content="Turn one or more photos into a single PDF. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23F2F2F0%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237C5CFF%22 stroke-width=%226%22/></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-base="../">

<header id="chrome-nav"></header>

<main class="tool-page">
  <div class="tool-header">
    <div class="wrap">
      <span class="kicker">To PDF</span>
      <h1>Image → PDF</h1>
      <p>Add photos, put them in order, and export a single PDF — one image per page.</p>
    </div>
  </div>

  <div class="wrap tool-body">
    <div>
      <div class="panel">
        <h3>Add images</h3>
        <div class="dropzone" id="dz" role="button">
          <p><strong>Click to choose</strong> or drop JPG / PNG / WebP files here</p>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="status" id="status"></div>
        <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>Page setup</h3>
        <div class="field">
          <label for="pageSize">Page size</label>
          <select id="pageSize">
            <option value="fit">Fit the page to each image</option>
            <option value="a4">A4</option>
            <option value="letter">US Letter</option>
          </select>
        </div>
        <div class="field">
          <label for="orient">Orientation</label>
          <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
        </div>
        <div class="field">
          <label for="margin">Margin</label>
          <input type="range" id="margin" min="0" max="80" value="0">
          <div class="range-row"><span>Edge to edge</span><span id="marginVal">0 pt</span><span>Wide</span></div>
        </div>
        <button class="btn btn-accent btn-block" id="buildBtn" disabled>Create PDF</button>
        <div class="note"><strong>Tip.</strong> Click a thumbnail to take that image out again.</div>
      </div>
    </div>
  </div>
</main>

<section class="related" id="related"></section>
<footer id="chrome-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../assets/helpers.js"></script>
<script>
let files = [];
const dz = document.getElementById('dz'), fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs'), buildBtn = document.getElementById('buildBtn');
const status = document.getElementById('status');
const progressWrap = document.getElementById('progressWrap'), progressBar = document.getElementById('progressBar');
const margin = document.getElementById('margin');
margin.addEventListener('input', ()=> document.getElementById('marginVal').textContent = margin.value + ' pt');

wireDropzone(dz, fileInput, (nf)=>{ files = files.concat(nf.filter(f=> f.type.startsWith('image/'))); render(); });

function render(){
  thumbs.innerHTML = '';
  files.forEach((f,i)=>{
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.title = f.name + ' — click to remove';
    img.addEventListener('click', ()=>{ files.splice(i,1); render(); });
    thumbs.appendChild(img);
  });
  buildBtn.disabled = files.length === 0;
  setStatus(status, files.length ? `${files.length} image${files.length>1?'s':''} added.` : '');
}

buildBtn.addEventListener('click', async ()=>{
  buildBtn.disabled = true;
  setStatus(status, 'Building PDF…');
  setProgress(progressBar, progressWrap, 10);
  try{
    const { PDFDocument } = PDFLib;
    const pdf = await PDFDocument.create();
    const mode = document.getElementById('pageSize').value;
    const land = document.getElementById('orient').value === 'landscape';
    const m = parseInt(margin.value) || 0;
    const SIZES = { a4:[595.28,841.89], letter:[612,792] };

    for (let i=0;i<files.length;i++){
      const bytes = await readFileAsArrayBuffer(files[i]);
      let img;
      try{
        img = files[i].type === 'image/png' ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);
      }catch(e){
        img = await pdf.embedJpg(await reencode(files[i]));
      }
      let pw, ph, dw, dh, x, y;
      if (mode === 'fit'){
        pw = img.width + m*2; ph = img.height + m*2; dw = img.width; dh = img.height; x = m; y = m;
      } else {
        [pw, ph] = SIZES[mode];
        if (land) [pw, ph] = [ph, pw];
        const s = Math.min((pw-m*2)/img.width, (ph-m*2)/img.height);
        dw = img.width*s; dh = img.height*s; x = (pw-dw)/2; y = (ph-dh)/2;
      }
      pdf.addPage([pw, ph]).drawImage(img, { x, y, width: dw, height: dh });
      setProgress(progressBar, progressWrap, 10 + Math.round(((i+1)/files.length)*80));
    }
    downloadBlob(new Blob([await pdf.save()], {type:'application/pdf'}), 'images.pdf');
    setProgress(progressBar, progressWrap, 100);
    setStatus(status, 'Done — your PDF is in your downloads.', 'ok');
  }catch(e){ console.error(e); setStatus(status, 'One of those images could not be read. Try converting it to JPG or PNG first.', 'err'); }
  buildBtn.disabled = false;
});

async function reencode(file){
  const dataUrl = await readFileAsDataURL(file);
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = async ()=>{
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0);
      const blob = await canvasToBlob(c, 'image/jpeg', 0.92);
      res(new Uint8Array(await blob.arrayBuffer()));
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF — File Studio</title>
<meta name="description" content="Pull out page ranges, or burst a PDF into single pages. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23F2F2F0%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237C5CFF%22 stroke-width=%226%22/></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-base="../">

<header id="chrome-nav"></header>

<main class="tool-page">
  <div class="tool-header">
    <div class="wrap">
      <span class="kicker">Organise</span>
      <h1>Split PDF</h1>
      <p>Keep only the pages you need, cut a document into fixed-size chunks, or burst it into one file per page.</p>
    </div>
  </div>

  <div class="wrap tool-body">
    <div>
      <div class="panel">
        <h3>Upload PDF</h3>
        <div class="dropzone" id="dz" role="button">
          <p><strong>Click to choose</strong> or drop a PDF file here</p>
          <input type="file" id="fileInput" accept="application/pdf">
        </div>
        <div class="status" id="status"></div>
        <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>How to split</h3>
        <div class="tabs" id="tabs">
          <button class="tab on" data-mode="range">Page range</button>
          <button class="tab" data-mode="every">Every N pages</button>
          <button class="tab" data-mode="burst">One per page</button>
        </div>

        <div class="field" id="rangeField">
          <label for="ranges">Pages to keep</label>
          <input type="text" id="ranges" placeholder="e.g. 1-3, 7, 12-">
          <div class="range-row"><span>Use commas for separate pages, a dash for a run.</span></div>
        </div>

        <div class="field" id="everyField" style="display:none;">
          <label for="chunk">Pages per file</label>
          <input type="number" id="chunk" value="5" min="1">
        </div>

        <button class="btn btn-accent btn-block" id="goBtn" disabled>Split PDF</button>
        <div class="note"><strong>Note.</strong> More than one output file is bundled into a zip.</div>
      </div>
    </div>
  </div>
</main>

<section class="related" id="related"></section>
<footer id="chrome-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../assets/helpers.js"></script>
<script>
let file = null, pageCount = 0, mode = 'range';
const dz = document.getElementById('dz'), fileInput = document.getElementById('fileInput');
const status = document.getElementById('status'), goBtn = document.getElementById('goBtn');
const progressWrap = document.getElementById('progressWrap'), progressBar = document.getElementById('progressBar');
const rangeField = document.getElementById('rangeField'), everyField = document.getElementById('everyField');

document.querySelectorAll('#tabs .tab').forEach(t=> t.addEventListener('click', ()=>{
  document.querySelectorAll('#tabs .tab').forEach(x=> x.classList.toggle('on', x===t));
  mode = t.dataset.mode;
  rangeField.style.display = mode === 'range' ? 'block' : 'none';
  everyField.style.display = mode === 'every' ? 'block' : 'none';
}));

wireDropzone(dz, fileInput, async (fs)=>{
  const f = fs.find(isPdf); if (!f) return;
  try{
    const { PDFDocument } = PDFLib;
    const doc = await PDFDocument.load(await readFileAsArrayBuffer(f));
    file = f; pageCount = doc.getPageCount(); goBtn.disabled = false;
    setStatus(status, `"${f.name}" — ${pageCount} pages, ${formatBytes(f.size)}.`, 'ok');
  }catch(e){ setStatus(status, 'That PDF could not be opened. It may be password-protected.', 'err'); }
});

goBtn.addEventListener('click', async ()=>{
  if (!file) return;
  goBtn.disabled = true;
  setStatus(status, 'Splitting…');
  setProgress(progressBar, progressWrap, 10);
  try{
    const { PDFDocument } = PDFLib;
    const src = await PDFDocument.load(await readFileAsArrayBuffer(file));
    const name = baseName(file.name);
    let groups = [];
    if (mode === 'range'){
      const idx = parseRanges(document.getElementById('ranges').value, pageCount);
      if (!idx.length) throw new Error('empty selection');
      groups = [{ label: 'selected-pages', idx }];
    } else if (mode === 'every'){
      const n = Math.max(1, parseInt(document.getElementById('chunk').value) || 1);
      for (let i=0;i<pageCount;i+=n){
        const idx = Array.from({length: Math.min(n, pageCount-i)}, (_,k)=> i+k);
        groups.push({ label: `pages-${i+1}-${i+idx.length}`, idx });
      }
    } else {
      for (let i=0;i<pageCount;i++) groups.push({ label: `page-${String(i+1).padStart(2,'0')}`, idx:[i] });
    }

    const outputs = [];
    for (let g=0; g<groups.length; g++){
      const doc = await PDFDocument.create();
      const pages = await doc.copyPages(src, groups[g].idx);
      pages.forEach(p=> doc.addPage(p));
      outputs.push({ name: `${name}-${groups[g].label}.pdf`, bytes: await doc.save() });
      setProgress(progressBar, progressWrap, 10 + Math.round(((g+1)/groups.length)*80));
    }

    if (outputs.length === 1){
      downloadBlob(new Blob([outputs[0].bytes], {type:'application/pdf'}), outputs[0].name);
    } else {
      const zip = new JSZip();
      outputs.forEach(o=> zip.file(o.name, o.bytes));
      downloadBlob(await zip.generateAsync({ type:'blob' }), `${name}-split.zip`);
    }
    setProgress(progressBar, progressWrap, 100);
    setStatus(status, `Done — ${outputs.length} file${outputs.length>1?'s':''} saved.`, 'ok');
  }catch(err){
    console.error(err);
    setStatus(status, 'Nothing was produced. Check your page numbers are inside the document.', 'err');
  }
  goBtn.disabled = false;
});
</script>
</body>
</html>

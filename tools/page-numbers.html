<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add page numbers — File Studio</title>
<meta name="description" content="Stamp page numbers anywhere on the page, in your format. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23F2F2F0%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237C5CFF%22 stroke-width=%226%22/></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-base="../">

<header id="chrome-nav"></header>

<main class="tool-page">
  <div class="tool-header">
    <div class="wrap">
      <span class="kicker">Organise</span>
      <h1>Add page numbers</h1>
      <p>Stamp numbers onto an existing PDF — pick the corner, the wording and where counting starts.</p>
    </div>
  </div>

  <div class="wrap tool-body">
    <div>
      <div class="panel">
        <h3>Upload PDF</h3>
        <div class="dropzone" id="dz" role="button">
          <p><strong>Click to choose</strong> or drop a PDF file here</p>
          <input type="file" id="fileInput" accept="application/pdf">
        </div>
        <div class="status" id="status"></div>
        <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>Numbering</h3>
        <div class="field">
          <label for="format">Wording</label>
          <select id="format">
            <option value="n">1</option>
            <option value="page n">Page 1</option>
            <option value="n / t" selected>1 / 12</option>
            <option value="page n of t">Page 1 of 12</option>
            <option value="- n -">- 1 -</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pos">Position</label>
            <select id="pos">
              <option value="bc" selected>Bottom centre</option>
              <option value="br">Bottom right</option>
              <option value="bl">Bottom left</option>
              <option value="tc">Top centre</option>
              <option value="tr">Top right</option>
              <option value="tl">Top left</option>
            </select>
          </div>
          <div class="field">
            <label for="size">Text size</label>
            <input type="number" id="size" value="10" min="6" max="40">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="start">First number</label>
            <input type="number" id="start" value="1" min="0">
          </div>
          <div class="field">
            <label for="skip">Skip first pages</label>
            <input type="number" id="skip" value="0" min="0">
          </div>
        </div>
        <button class="btn btn-accent btn-block" id="goBtn" disabled>Add page numbers</button>
      </div>
    </div>
  </div>
</main>

<section class="related" id="related"></section>
<footer id="chrome-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../assets/helpers.js"></script>
<script>
let file = null;
const dz = document.getElementById('dz'), fileInput = document.getElementById('fileInput');
const status = document.getElementById('status'), goBtn = document.getElementById('goBtn');
const progressWrap = document.getElementById('progressWrap'), progressBar = document.getElementById('progressBar');

wireDropzone(dz, fileInput, (fs)=>{
  const f = fs.find(isPdf); if (!f) return;
  file = f; goBtn.disabled = false;
  setStatus(status, `"${f.name}" ready.`, 'ok');
});

goBtn.addEventListener('click', async ()=>{
  if (!file) return;
  goBtn.disabled = true;
  setStatus(status, 'Stamping pages…');
  setProgress(progressBar, progressWrap, 15);
  try{
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.load(await readFileAsArrayBuffer(file));
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const size = parseInt(document.getElementById('size').value) || 10;
    const fmt = document.getElementById('format').value;
    const pos = document.getElementById('pos').value;
    const start = parseInt(document.getElementById('start').value) || 0;
    const skip = parseInt(document.getElementById('skip').value) || 0;
    const pages = doc.getPages();
    const total = pages.length - skip;
    const M = 32;

    pages.forEach((page, i)=>{
      if (i < skip) return;
      const n = start + (i - skip);
      const label = winAnsi(fmt.replace('page','Page').replace(/\bn\b/, n).replace(/\bt\b/, total + start - 1));
      const w = font.widthOfTextAtSize(label, size);
      const { width, height } = page.getSize();
      const x = pos[1] === 'l' ? M : pos[1] === 'r' ? width - M - w : (width - w)/2;
      const y = pos[0] === 'b' ? M - size/2 : height - M;
      page.drawText(label, { x, y, size, font, color: rgb(0.1,0.1,0.1) });
      setProgress(progressBar, progressWrap, 15 + Math.round(((i+1)/pages.length)*75));
    });

    downloadBlob(new Blob([await doc.save()], {type:'application/pdf'}), baseName(file.name) + '-numbered.pdf');
    setProgress(progressBar, progressWrap, 100);
    setStatus(status, 'Done — numbered PDF saved.', 'ok');
  }catch(e){ console.error(e); setStatus(status, 'Could not write to that PDF. It may be password-protected.', 'err'); }
  goBtn.disabled = false;
});
</script>
</body>
</html>

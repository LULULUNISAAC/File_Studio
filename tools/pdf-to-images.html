<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Images — File Studio</title>
<meta name="description" content="Export every page of a PDF as an image. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23F2F2F0%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%237C5CFF%22 stroke-width=%226%22/></svg>">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-base="../">

<header id="chrome-nav"></header>

<main class="tool-page">
  <div class="tool-header">
    <div class="wrap">
      <span class="kicker">From PDF</span>
      <h1>PDF → Images</h1>
      <p>Export pages as picture files. One page downloads on its own; several are bundled into a zip.</p>
    </div>
  </div>

  <div class="wrap tool-body">
    <div>
      <div class="panel">
        <h3>Upload PDF</h3>
        <div class="dropzone" id="dz" role="button">
          <p><strong>Click to choose</strong> or drop a PDF file here</p>
          <input type="file" id="fileInput" accept="application/pdf">
        </div>
        <div class="status" id="status"></div>
        <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>Export</h3>
        <div class="field">
          <label for="quality">Resolution</label>
          <select id="quality">
            <option value="1.5">Standard — screen</option>
            <option value="2.5" selected>High — printing</option>
            <option value="4">Very high — archival</option>
          </select>
        </div>
        <div class="field">
          <label for="format">File type</label>
          <select id="format"><option value="image/png" selected>PNG — sharpest</option><option value="image/jpeg">JPG — smaller</option></select>
        </div>
        <div class="field"><label for="pages">Pages</label><input type="text" id="pages" placeholder="all pages — or 1-3, 7"></div>
        <button class="btn btn-accent btn-block" id="exportBtn" disabled>Export images</button>
      </div>
    </div>
  </div>
</main>

<section class="related" id="related"></section>
<footer id="chrome-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../assets/helpers.js"></script>
<script>
usePdfJs();
let file = null;
const dz = document.getElementById('dz'), fileInput = document.getElementById('fileInput');
const status = document.getElementById('status'), exportBtn = document.getElementById('exportBtn');
const thumbs = document.getElementById('thumbs');
const progressWrap = document.getElementById('progressWrap'), progressBar = document.getElementById('progressBar');

wireDropzone(dz, fileInput, (fs)=>{
  const f = fs.find(isPdf); if (!f) return;
  file = f; exportBtn.disabled = false; thumbs.innerHTML = '';
  setStatus(status, `"${f.name}" (${formatBytes(f.size)}) ready.`, 'ok');
});

exportBtn.addEventListener('click', async ()=>{
  if (!file) return;
  exportBtn.disabled = true; thumbs.innerHTML = '';
  setStatus(status, 'Rendering pages…');
  setProgress(progressBar, progressWrap, 5);
  try{
    const scale = parseFloat(document.getElementById('quality').value);
    const type = document.getElementById('format').value;
    const ext = type === 'image/png' ? 'png' : 'jpg';
    const doc = await loadPdfJsDoc(file);
    const wanted = parseRanges(document.getElementById('pages').value, doc.numPages);
    const blobs = [];
    for (let k=0;k<wanted.length;k++){
      const i = wanted[k] + 1;
      const canvas = await renderPageToCanvas(await doc.getPage(i), scale);
      const blob = await canvasToBlob(canvas, type, 0.92);
      blobs.push({ name: `page-${String(i).padStart(2,'0')}.${ext}`, blob });
      const img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      thumbs.appendChild(img);
      setProgress(progressBar, progressWrap, 5 + Math.round(((k+1)/wanted.length)*85));
    }
    if (blobs.length === 1) downloadBlob(blobs[0].blob, blobs[0].name);
    else {
      const zip = new JSZip();
      blobs.forEach(b=> zip.file(b.name, b.blob));
      downloadBlob(await zip.generateAsync({ type:'blob' }), baseName(file.name) + '-pages.zip');
    }
    setProgress(progressBar, progressWrap, 100);
    setStatus(status, `Done — ${blobs.length} page${blobs.length>1?'s':''} exported.`, 'ok');
  }catch(e){ console.error(e); setStatus(status, 'Could not read that PDF. It may be password-protected.', 'err'); }
  exportBtn.disabled = false;
});
</script>
</body>
</html>
